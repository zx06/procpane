name: cli

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: CLI tests and smoke
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq python3
          chmod +x scripts/test-cli.sh
          ./scripts/test-cli.sh
      - name: Cross-compile Windows CLI
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o bin/procpane.exe ./cmd/procpane
