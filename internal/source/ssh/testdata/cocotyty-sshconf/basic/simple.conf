# Basic SSH Config Test Cases
# 基础SSH配置测试用例

# Case 1: Simple single host
Host simple
    Hostname simple.example.com
    User admin
    Port 2222

# Case 2: Multiple hosts with different settings
Host web
    Hostname web.example.com
    User webuser

Host db
    Hostname db.example.com
    User dbadmin
    Port 3306

# Case 3: Global defaults (should be last)
Host *
    User defaultuser
    Port 22
    ServerAliveInterval 60
