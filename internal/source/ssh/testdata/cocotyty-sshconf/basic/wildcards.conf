# Wildcard Patterns Test
# 通配符模式测试

# Specific production server
Host prod.server.example.com
    User prodadmin
    IdentityFile ~/.ssh/prod_key

# All servers in example.com domain
Host *.example.com
    User exampleuser
    Port 2222
    ForwardAgent yes

# All staging servers
Host *.staging.*
    User staginguser
    Port 2223

# Negated pattern - exclude specific host from wildcard
Host *.internal.company.com !secure.internal.company.com
    User internaluser
    ProxyCommand ssh -W %h:%p bastion

# This should be excluded by the negated pattern above
Host secure.internal.company.com
    User secureadmin
    Port 2224
