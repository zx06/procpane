# Real World Enterprise Config
# 真实企业级配置示例

# Jump host / Bastion
Host bastion
    Hostname bastion.company.com
    User bastionuser
    Port 2222
    IdentityFile ~/.ssh/bastion_key
    ControlMaster auto
    ControlPath ~/.ssh/controlmasters/%r@%h:%p
    ControlPersist 10m

# Production database (direct access restricted)
Host prod-db
    Hostname prod-db.internal.company.com
    User dbadmin
    IdentityFile ~/.ssh/prod_db_key
    ProxyCommand ssh -W %h:%p bastion
    LocalForward 5433 localhost:5432

# All production servers behind bastion
Host prod-*
    User produser
    IdentityFile ~/.ssh/prod_key
    ProxyCommand ssh -W %h:%p bastion
    StrictHostKeyChecking yes
    UserKnownHostsFile ~/.ssh/known_hosts_prod

# Staging environment
Host staging-*
    Hostname %h.staging.company.com
    User staginguser
    IdentityFile ~/.ssh/staging_key
    Port 2222

# Development environment (local VMs)
Host dev-*
    Hostname %h.local
    User vagrant
    Port 2222
    UserKnownHostsFile /dev/null
    StrictHostKeyChecking no

# GitHub
Host github.com
    User git
    IdentityFile ~/.ssh/github_key
    Hostname github.com

# GitLab
Host gitlab.company.com
    User git
    IdentityFile ~/.ssh/gitlab_key
    Port 2222

# Default settings for all other hosts
Host *
    User defaultuser
    Port 22
    ServerAliveInterval 60
    ServerAliveCountMax 3
    HashKnownHosts yes
    AddKeysToAgent yes
    IdentityFile ~/.ssh/id_rsa
    IdentityFile ~/.ssh/id_ed25519
